# TESTE MEDIDO DO CLOUD VISION OCR — disparo manual, não roda em push.
#
# Existe porque ninguém do time acessa o console do GCP: a única forma de exercer
# a API com credencial de verdade é aqui, pelo mesmo Workload Identity Federation
# que o deploy já usa. O documento do teste é SINTÉTICO (gerado no próprio job),
# então nenhum dado de cliente sai da infraestrutura.
name: Teste Cloud Vision OCR

on:
  workflow_dispatch:
    inputs:
      paginas:
        description: "Quantas páginas de balancete sintético testar"
        required: false
        default: "3"

permissions:
  id-token: write
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: google-github-actions/auth@v2
        id: auth
        with:
          workload_identity_provider: projects/354808361877/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deploy@quantua.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - uses: google-github-actions/setup-gcloud@v2

      # A API precisa estar ligada no projeto. Se a conta de serviço do deploy não
      # tiver permissão para ligar, o passo falha COM A MENSAGEM EXATA — que é a
      # informação acionável (qual papel conceder), não um erro genérico depois.
      - name: Habilitar Vision API (idempotente)
        run: |
          set +e
          gcloud services enable vision.googleapis.com --project=quantua 2>&1 | tee /tmp/enable.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::warning::Nao foi possivel habilitar a Vision API com a conta do deploy."
            echo "Conceda a github-deploy@quantua.iam.gserviceaccount.com o papel"
            echo "roles/serviceusage.serviceUsageAdmin, OU habilite a API uma vez no console."
          fi
          gcloud services list --enabled --project=quantua --filter="config.name:vision" --format="value(config.name)"

      - name: Instalar dependências
        run: npm ci

      - name: Medir fidelidade do Cloud Vision
        env:
          GCP_TOKEN: ${{ steps.auth.outputs.access_token }}
          PAGINAS: ${{ inputs.paginas }}
        run: npx tsx scripts/vision-teste.ts
