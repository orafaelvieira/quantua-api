# Deploy automático no push em main (substitui o auto-deploy do DO App Platform).
# Auth sem segredos: OIDC do GitHub → Workload Identity Federation do GCP.
name: Deploy API (Cloud Run)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  id-token: write
  contents: read

concurrency: deploy-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/354808361877/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deploy@quantua.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build e push da imagem
        run: |
          gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet
          IMAGE=southamerica-east1-docker.pkg.dev/quantua/quantua/quantua-api:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Secrets, envs e Cloud SQL seguem preservados da revisão anterior (não são
      # passados aqui). O que MUDOU em 24/07/2026: as três configurações de que o
      # código depende para funcionar passam a ser declaradas no repositório, em
      # vez de existirem só no serviço — onde ninguém as vê e um ajuste futuro as
      # derruba sem deixar rastro.
      #
      # --timeout=1800  O padrão do Cloud Run é 300s e o cliente do front espera
      #   até 300s na reconciliação multi-documento com IA (api.ts). Empate exato:
      #   qualquer variação e o Cloud Run corta primeiro, devolvendo 504 no meio
      #   do processamento de um IBR. 30 min dão folga sobre a operação mais longa.
      #
      # --min-instances=1 --max-instances=1  O node-cron roda IN-PROCESS e o
      #   rate-limit e os locks são em memória: com 2 instâncias o snapshot diário
      #   roda duas vezes, o sync da CVM concorre consigo mesmo e o rate-limit
      #   fura. min=1 também mantém a CPU sempre alocada, sem o que os crons nem
      #   disparam. Já estava assim no serviço; agora está escrito.
      # --update-env-vars=ANTHROPIC_API_KEY  (31/07/2026) A chave da Anthropic era
      #   um resquício da configuração manual do serviço, de uma conta SEM créditos —
      #   toda IA de prod parou em silêncio ("credit balance is too low") e ninguém
      #   via de onde vinha a chave. Agora ela é declarada AQUI, a partir do segredo
      #   ANTHROPIC_API_KEY do repositório (gh secret set ANTHROPIC_API_KEY). Rotação
      #   de chave = atualizar o segredo + redeploy, sem tocar em painel.
      - name: Deploy Cloud Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Segredo ANTHROPIC_API_KEY ausente no repositório — rode: gh secret set ANTHROPIC_API_KEY -R orafaelvieira/quantua-api"
            exit 1
          fi
          # A chave ANTIGA estava mapeada do Secret Manager (mesmo nome), e o
          # gcloud recusa remover o mapeamento E definir a env var no MESMO
          # comando ("Cannot update environment variable ... different type").
          # Duas fases: 1) desfaz o mapeamento (vira no-op com "|| true" quando
          # já não existe); 2) o deploy define a env var declarada.
          gcloud run services update quantua-api \
            --region=southamerica-east1 \
            --remove-secrets=ANTHROPIC_API_KEY || true
          gcloud run deploy quantua-api \
            --image=southamerica-east1-docker.pkg.dev/quantua/quantua/quantua-api:${{ github.sha }} \
            --region=southamerica-east1 \
            --timeout=1800 \
            --min-instances=1 \
            --max-instances=1 \
            --update-env-vars=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
